<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="graphics/tt/favicon-16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="graphics/tt/favicon-32x32.png" sizes="32x32">

    <meta charset="utf-8">
    <title>Ball Online </title>

    <link rel="preload" href="fonts/fptmed.otf" as="font" crossorigin="anonymous">
    <link rel="preload" href="fonts/fptbook.otf" as="font" crossorigin="anonymous">
    <link rel="preload" href="fonts/fptbook_fixed_5.otf" as="font" crossorigin="anonymous">
    <link rel="preload" href="fonts/fptb.otf" as="font" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="css/roomlist.css">
    <link rel="stylesheet" type="text/css" href="css/checkbox.css">
    <link rel="stylesheet" type="text/css" href="css/maploadwindow.css">
    <link rel="stylesheet" type="text/css" href="css/leveleditor.css">
    <link rel="stylesheet" type="text/css" href="css/newbonklobby.css">
    <link rel="stylesheet" type="text/css" href="css/ingamechat.css">
    <link rel="stylesheet" type="text/css" href="css/simplemenu.css">
    <link rel="stylesheet" type="text/css" href="css/pagelayout.css">
    <link rel="stylesheet" type="text/css" href="css/skineditor.css">
    <link rel="stylesheet" type="text/css" href="css/mapeditor.css">
    <link rel="stylesheet" type="text/css" href="css/prettymenu.css">
    <link rel="stylesheet" type="text/css" href="css/classicactive.css" id="classicoverridecss">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1b26;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #181922;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu-box {
            background-color: #222330;
            width: 420px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .menu-box h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
            font-size: 13px;
            color: #a1a1aa;
        }

        .menu-input, .menu-select {
            width: 100%;
            padding: 10px 12px;
            background-color: #ffffff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 40px;
            height: 35px;
            cursor: pointer;
            background: none;
        }

        .menu-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 0;
            background-color: #d93838;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #ef4444;
        }

        .btn-secondary {
            background-color: #3b82f6;
        }
        .btn-secondary:hover {
            background-color: #60a5fa;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
            background: #111218;
        }

        canvas {
            display: block;
            background: #161720;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }

        #back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #d93838;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            z-index: 20;
        }

        #back-btn:hover {
            background: #ef4444;
        }

        #map-editor-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #181922;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <div class="menu-box">
            <h1>Ball ONLINE</h1>
            
            <div class="input-group">
                <label>Seu Nome:</label>
                <input type="text" id="playerNameInput" class="menu-input" value="Jogador" maxlength="15">
            </div>

            <div class="input-group">
                <label>Cor da Bolinha:</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="playerColorInput" value="#3b82f6">
                    <span style="font-size: 12px; color: #fff;">Escolha sua cor personalizada</span>
                </div>
            </div>

            <div class="input-group">
                <label>Modo de Jogo:</label>
                <select id="gameModeSelect" class="menu-select">
                    <option value="classic">Modo: Classic (Empurrar)</option>
                    <option value="football">Modo: Football</option>
                    <option value="deatharrows">Modo: Death Arrows</option>
                </select>
            </div>

            <div class="input-group">
                <label>Senha da Sala (Opcional):</label>
                <input type="password" id="roomPasswordInput" class="menu-input" placeholder="Deixe em branco se público">
            </div>

            <div class="menu-buttons">
                <button class="btn" id="createRoomBtn">Criar Sala</button>
                <button class="btn btn-secondary" id="joinRoomBtn">Entrar em Sala</button>
            </div>
            <div class="menu-buttons">
                <button class="btn" style="background-color: #4b5563;" id="openEditorBtn">Criar / Editar Mapa</button>
            </div>
        </div>
    </div>

    <div id="map-editor-container">
        <div class="menu-box" style="width: 500px;">
            <h1>Criador de Mapas</h1>
            <p style="font-size: 13px; color: #9ca3af; text-align: center;">Ferramenta para desenhar obstáculos personalizados para o modo Death Arrows.</p>
            <div class="input-group">
                <label>Nome do Mapa:</label>
                <input type="text" id="mapNameInput" class="menu-input" value="Meu Mapa Customizado">
            </div>
            <div class="menu-buttons">
                <button class="btn btn-secondary" id="saveMapBtn">Salvar Mapa</button>
                <button class="btn" id="closeEditorBtn">Voltar ao Menu</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <button id="back-btn" onclick="voltarMenu()">Sair</button>
        <div id="hud">Placar: <span id="score-board">Aguardando Jogadores...</span></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const mapEditorContainer = document.getElementById('map-editor-container');
        
        const createRoomBtn = document.getElementById('createRoomBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const openEditorBtn = document.getElementById('openEditorBtn');
        const closeEditorBtn = document.getElementById('closeEditorBtn');
        const saveMapBtn = document.getElementById('saveMapBtn');

        const gameModeSelect = document.getElementById('gameModeSelect');
        const playerNameInput = document.getElementById('playerNameInput');
        const playerColorInput = document.getElementById('playerColorInput');
        const roomPasswordInput = document.getElementById('roomPasswordInput');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');

        let gameRunning = false;
        let animationFrameId = null;
        let currentMode = 'classic';
        let playerScore = 0;
        let opponentScore = 0;
        let matchPaused = false;
        let pauseMessage = '';

        let myData = {
            name: 'Jogador',
            color: '#3b82f6',
            roomPass: ''
        };

        let remotePlayers = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const keys = {};
        window.addEventListener('keydown', (e) => { 
            keys[e.code] = true; 
            if (e.code === 'Space') e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        let player, platform, obstacles, ball, arrows, spawnPoints;
        let lastAbilityTime = 0;

        openEditorBtn.addEventListener('click', () => {
            menuContainer.style.display = 'none';
            mapEditorContainer.style.display = 'flex';
        });

        closeEditorBtn.addEventListener('click', () => {
            mapEditorContainer.style.display = 'none';
            menuContainer.style.display = 'flex';
        });

        saveMapBtn.addEventListener('click', () => {
            alert('Mapa salvo com sucesso no navegador!');
            mapEditorContainer.style.display = 'none';
            menuContainer.style.display = 'flex';
        });

        function iniciarJogo() {
            myData.name = playerNameInput.value.trim() || 'Jogador';
            myData.color = playerColorInput.value;
            myData.roomPass = roomPasswordInput.value;

            currentMode = gameModeSelect.value;
            playerScore = 0;
            opponentScore = 0;
            matchPaused = false;
            
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            resizeCanvas();
            resetEntities();
            gameRunning = true;
            loop();
        }

        createRoomBtn.addEventListener('click', iniciarJogo);
        joinRoomBtn.addEventListener('click', () => {
            let senhaInformada = prompt("Digite a senha da sala para entrar:");
            if (roomPasswordInput.value && senhaInformada !== roomPasswordInput.value) {
                alert("Senha incorreta!");
                return;
            }
            iniciarJogo();
        });

        function voltarMenu() {
            gameRunning = false;
            matchPaused = false;
            cancelAnimationFrame(animationFrameId);
            gameContainer.style.display = 'none';
            menuContainer.style.display = 'flex';
        }

        function resetEntities() {
            const w = canvas.width;
            const h = canvas.height;
            arrows = [];

            if (currentMode === 'football') {
                platform = {
                    x: w / 2 - 580,
                    y: h / 2 - 350,
                    w: 1160,
                    h: 700,
                    isFootballField: true
                };

                player = {
                    x: w / 2 - 380,
                    y: h / 2,
                    vx: 0,
                    vy: 0,
                    radius: 22,
                    mass: 1.5,
                    color: myData.color,
                    name: myData.name,
                    heavy: false,
                    isPlayer: true
                };

                ball = {
                    x: w / 2,
                    y: h / 2,
                    vx: 0,
                    vy: 0,
                    radius: 14,
                    mass: 0.3,
                    color: '#ffffff'
                };
                obstacles = [];
            } else if (currentMode === 'deatharrows') {
                platform = { isDeathArrowsMap: true };
                
                spawnPoints = [
                    { x: w * 0.12, y: h * 0.18 },
                    { x: w * 0.28, y: h * 0.12 },
                    { x: w * 0.60, y: h * 0.08 },
                    { x: w * 0.90, y: h * 0.28 },
                    { x: w * 0.95, y: h * 0.65 },
                    { x: w * 0.88, y: h * 0.92 },
                    { x: w * 0.36, y: h * 0.92 },
                    { x: w * 0.08, y: h * 0.82 }
                ];

                let sp1 = Math.floor(Math.random() * spawnPoints.length);

                player = {
                    x: spawnPoints[sp1].x,
                    y: spawnPoints[sp1].y,
                    vx: 0,
                    vy: 0,
                    radius: 22,
                    mass: 1.5,
                    color: myData.color,
                    name: myData.name,
                    heavy: false,
                    isPlayer: true
                };

                ball = null;
                obstacles = [
                    { x: w * 0.22, y: h * 0.08, w: 45, h: 12 },
                    { x: w * 0.28, y: h * 0.08, w: 12, h: 35 },
                    { x: w * 0.15, y: h * 0.38, w: 40, h: 12 },
                    { x: w * 0.15, y: h * 0.35, w: 12, h: 25 },
                    { x: w * 0.58, y: h * 0.04, w: 30, h: 15 },
                    { x: w * 0.58, y: h * 0.07, w: 12, h: 20 },
                    { x: w * 0.88, y: h * 0.22, w: 80, h: 12 },
                    { x: w * 0.88, y: h * 0.18, w: 12, h: 20 },
                    { x: w * 0.86, y: h * 0.55, w: 35, h: 12 },
                    { x: w * 0.92, y: h * 0.58, w: 12, h: 25 },
                    { x: w * 0.85, y: h * 0.88, w: 75, h: 12 },
                    { x: w * 0.85, y: h * 0.85, w: 12, h: 20 },
                    { x: w * 0.34, y: h * 0.88, w: 80, h: 12 },
                    { x: w * 0.46, y: h * 0.82, w: 12, h: 18 },
                    { x: w * 0.46, y: h * 0.82, w: 75, h: 12 },
                    { x: w * 0.52, y: h * 0.76, w: 12, h: 18 },
                    { x: w * 0.04, y: h * 0.78, w: 55, h: 12 },
                    { x: w * 0.04, y: h * 0.82, w: 12, h: 20 },
                    { x: w * 0.01, y: h * 0.85, w: 40, h: 12 }
                ];
            } else {
                const platformWidth = 700;

                platform = {
                    x: w / 2 - platformWidth / 2,
                    y: h / 2 + 100,
                    w: platformWidth,
                    h: 30,
                    isFootballField: false
                };

                player = {
                    x: w / 2 - 150,
                    y: h / 2,
                    vx: 0,
                    vy: 0,
                    radius: 22,
                    mass: 1.5,
                    color: myData.color,
                    name: myData.name,
                    heavy: false,
                    isPlayer: true
                };

                ball = null;
                obstacles = [];
            }
        }

        function lidarComEliminacao(quemMorreu) {
            if (quemMorreu === 'jogador') {
                opponentScore++;
                pauseMessage = 'PONTO DOS ADVERSÁRIOS!';
            } else {
                playerScore++;
                pauseMessage = 'PONTO DO JOGADOR!';
            }
            atualizarPlacar();

            if (checarFimDeJogo()) return;

            matchPaused = true;
            resetEntities();

            let segundosRestantes = 3;
            let intervalo = setInterval(() => {
                segundosRestantes--;
                if (segundosRestantes <= 0) {
                    clearInterval(intervalo);
                    matchPaused = false;
                    pauseMessage = '';
                }
            }, 1000);
        }

        function dispararChuteFootball() {
            if (currentMode !== 'football' || !gameRunning || matchPaused || !ball) return;
            const agora = Date.now();
            if (agora - lastAbilityTime >= 700) {
                lastAbilityTime = agora;
                let dist = Math.hypot(ball.x - player.x, ball.y - player.y);
                if (dist < player.radius + ball.radius + 20) {
                    let angle = Math.atan2(ball.y - player.y, ball.x - player.x);
                    ball.vx = Math.cos(angle) * 7.5;
                    ball.vy = Math.sin(angle) * 7.5;
                }
            }
        }

        function dispararFlechaDeathArrows() {
            if (currentMode !== 'deatharrows' || !gameRunning || matchPaused) return;
            const agora = Date.now();
            if (agora - lastAbilityTime >= 1500) {
                lastAbilityTime = agora;
                let angle = 0;
                arrows.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(angle) * 12,
                    vy: Math.sin(angle) * 12,
                    shooter: player,
                    noChao: false,
                    tempoChao: 0
                });
            }
        }

        function checarFimDeJogo() {
            let limiteGols = 3;
            if (playerScore >= limiteGols || opponentScore >= limiteGols) {
                gameRunning = false;
                matchPaused = false;
                let vencedor = playerScore >= limiteGols ? 'Você venceu a partida!' : 'Adversários venceram!';
                setTimeout(() => {
                    alert(`Fim de Jogo! ${vencedor} (${playerScore} x ${opponentScore})`);
                    voltarMenu();
                }, 50);
                return true;
            }
            return false;
        }

        function resolverColisoesCirculares(e1, e2) {
            let dx = e2.x - e1.x;
            let dy = e2.y - e1.y;
            let dist = Math.hypot(dx, dy);
            let minDist = e1.radius + e2.radius;

            if (dist < minDist && dist > 0) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;

                let totalMass = e1.mass + e2.mass;
                e1.x -= nx * overlap * (e2.mass / totalMass);
                e1.y -= ny * overlap * (e2.mass / totalMass);
                e2.x += nx * overlap * (e1.mass / totalMass);
                e2.y += ny * overlap * (e1.mass / totalMass);

                let kx = e1.vx - e2.vx;
                let ky = e1.vy - e2.vy;
                let p = 2 * (nx * kx + ny * ky) / totalMass;

                let restituicao = (e1 === ball || e2 === ball) ? 0.65 : 0.8;

                e1.vx -= p * e2.mass * nx * restituicao;
                e1.vy -= p * e2.mass * ny * restituicao;
                e2.vx += p * e1.mass * nx * restituicao;
                e2.vy += p * e1.mass * ny * restituicao;
            }
        }

        function updatePhysics() {
            if (matchPaused) return;

            let gravity = 0.4;
            if (currentMode === 'classic') gravity = 0.55;
            else if (currentMode === 'football') gravity = 0;
            else if (currentMode === 'deatharrows') gravity = 0.2;

            const friction = currentMode === 'football' ? 0.92 : 0.93;

            const entities = [player, ...remotePlayers];
            if (ball) entities.push(ball);

            entities.forEach(ent => {
                if (ent === ball) {
                    ent.vx *= 0.94;
                    ent.vy *= 0.94;
                    ent.x += ent.vx;
                    ent.y += ent.vy;
                } else {
                    ent.vy += gravity;
                    ent.vx *= friction;
                    ent.vy *= friction;
                    ent.x += ent.vx;
                    ent.y += ent.vy;
                }

                if (currentMode === 'football') {
                    let minX = platform.x + ent.radius;
                    let maxX = platform.x + platform.w - ent.radius;
                    let minY = platform.y + ent.radius;
                    let maxY = platform.y + platform.h - ent.radius;

                    let golAlturaMin = platform.y + platform.h * 0.35;
                    let golAlturaMax = platform.y + platform.h * 0.65;

                    if (ent.x < minX) {
                        if (ent === ball && ent.y > golAlturaMin && ent.y < golAlturaMax) {
                            lidarComEliminacao('adversario');
                            return;
                        }
                        ent.x = minX;
                        ent.vx *= -0.4;
                    } else if (ent.x > maxX) {
                        if (ent === ball && ent.y > golAlturaMin && ent.y < golAlturaMax) {
                            lidarComEliminacao('jogador');
                            return;
                        }
                        ent.x = maxX;
                        ent.vx *= -0.4;
                    }

                    if (ent.y < minY) { ent.y = minY; ent.vy *= -0.4; }
                    else if (ent.y > maxY) { ent.y = maxY; ent.vy *= -0.4; }

                    if (ent === ball) {
                        let cornerThreshold = 40;
                        let pushForce = 1.5;
                        if (ent.x < platform.x + cornerThreshold && ent.y < platform.y + cornerThreshold) {
                            ent.vx += pushForce; ent.vy += pushForce;
                        } else if (ent.x > platform.x + platform.w - cornerThreshold && ent.y < platform.y + cornerThreshold) {
                            ent.vx -= pushForce; ent.vy += pushForce;
                        } else if (ent.x < platform.x + cornerThreshold && ent.y > platform.y + platform.h - cornerThreshold) {
                            ent.vx += pushForce; ent.vy -= pushForce;
                        } else if (ent.x > platform.x + platform.w - cornerThreshold && ent.y > platform.y + platform.h - cornerThreshold) {
                            ent.vx -= pushForce; ent.vy -= pushForce;
                        }
                    }
                } else if (currentMode === 'deatharrows') {
                    if (ent.x < ent.radius) { ent.x = ent.radius; ent.vx *= -0.5; }
                    if (ent.x > canvas.width - ent.radius) { ent.x = canvas.width - ent.radius; ent.vx *= -0.5; }
                    if (ent.y < ent.radius) { ent.y = ent.radius; ent.vy *= -0.5; }
                    if (ent.y > canvas.height - ent.radius) { ent.y = canvas.height - ent.radius; ent.vy *= -0.5; }

                    obstacles.forEach(obs => {
                        if (ent.x + ent.radius > obs.x && ent.x - ent.radius < obs.x + obs.w &&
                            ent.y + ent.radius > obs.y && ent.y - ent.radius < obs.y + obs.h) {
                            let overlapX1 = (ent.x + ent.radius) - obs.x;
                            let overlapX2 = (obs.x + obs.w) - (ent.x - ent.radius);
                            let overlapY1 = (ent.y + ent.radius) - obs.y;
                            let overlapY2 = (obs.y + obs.h) - (ent.y - ent.radius);

                            let minX = Math.min(overlapX1, overlapX2);
                            let minY = Math.min(overlapY1, overlapY2);

                            if (minX < minY) {
                                if (overlapX1 < overlapX2) { ent.x = obs.x - ent.radius; ent.vx *= -0.3; }
                                else { ent.x = obs.x + obs.w + ent.radius; ent.vx *= -0.3; }
                            } else {
                                if (overlapY1 < overlapY2) { ent.y = obs.y - ent.radius; ent.vy *= -0.3; }
                                else { ent.y = obs.y + obs.h + ent.radius; ent.vy *= -0.3; }
                            }
                        }
                    });
                } else {
                    if (ent.x > platform.x && ent.x < platform.x + platform.w) {
                        let targetY = platform.y;
                        if (ent.y + ent.radius >= targetY && ent.y - ent.radius <= targetY + platform.h && ent.vy > 0) {
                            ent.y = targetY - ent.radius;
                            ent.vy *= -0.3;
                            ent.vx *= 0.85;
                        }
                    }

                    let morreu = false;
                    if (ent.y > canvas.height + 150 || ent.x < -200 || ent.x > canvas.width + 200) {
                        morreu = true;
                    } else if (currentMode === 'classic' && ent.y < -120) {
                        morreu = true;
                    }

                    if (morreu) {
                        if (ent.isPlayer) lidarComEliminacao('jogador');
                    }
                }
            });

            if (currentMode === 'classic' || currentMode === 'football') {
                for (let i = 0; i < entities.length; i++) {
                    for (let j = i + 1; j < entities.length; j++) {
                        resolverColisoesCirculares(entities[i], entities[j]);
                    }
                }
            }

            if (currentMode === 'deatharrows' && arrows) {
                for (let i = arrows.length - 1; i >= 0; i--) {
                    let arrow = arrows[i];
                    if (!arrow.noChao) {
                        arrow.x += arrow.vx;
                        arrow.y += arrow.vy;
                        let bateuChao = arrow.y >= canvas.height - 10;
                        obstacles.forEach(obs => {
                            if (arrow.x > obs.x && arrow.x < obs.x + obs.w && arrow.y > obs.y && arrow.y < obs.y + obs.h) {
                                bateuChao = true;
                            }
                        });
                        if (bateuChao) {
                            arrow.noChao = true;
                            arrow.tempoChao = Date.now();
                        }
                    } else {
                        if (Date.now() - arrow.tempoChao > 6700) {
                            arrows.splice(i, 1);
                        }
                    }
                }
            }
        }

        function handleControls() {
            if (matchPaused) return;

            let speed = currentMode === 'football' ? 0.25 : (currentMode === 'classic' ? 0.45 : 0.5);
            player.heavy = keys['ShiftLeft'] || keys['ShiftRight'];
            if (player.heavy) speed *= 0.5;

            if (keys['KeyA'] || keys['ArrowLeft']) player.vx -= speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.vx += speed;
            if (keys['KeyW'] || keys['ArrowUp']) player.vy -= speed;
            if (keys['KeyS'] || keys['ArrowDown']) player.vy += speed;

            if (currentMode === 'football' && keys['Space']) dispararChuteFootball();
            if (currentMode === 'deatharrows' && keys['Space']) dispararFlechaDeathArrows();
        }

        function atualizarPlacar() {
            let textoExtra = "";
            let agora = Date.now();
            if (currentMode === 'classic') {
                let tempoRestante = Math.max(0, ((2400 - (agora - lastAbilityTime)) / 1000).toFixed(1));
                textoExtra = tempoRestante > 0 ? ` | [Espaço CD: ${tempoRestante}s]` : ` | [Espaço PRONTO!]`;
            } else if (currentMode === 'football') {
                let tempoRestante = Math.max(0, ((700 - (agora - lastAbilityTime)) / 1000).toFixed(1));
                textoExtra = tempoRestante > 0 ? ` | [Chute CD: ${tempoRestante}s]` : ` | [Chute PRONTO!]`;
            } else if (currentMode === 'deatharrows') {
                let tempoRestante = Math.max(0, ((1500 - (agora - lastAbilityTime)) / 1000).toFixed(1));
                textoExtra = tempoRestante > 0 ? ` | [Arco CD: ${tempoRestante}s]` : ` | [Arco PRONTO!]`;
            }
            scoreBoard.innerText = `${myData.name} ${playerScore} x ${opponentScore} Outros${textoExtra}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            atualizarPlacar();

            if (currentMode === 'football') {
                ctx.fillStyle = '#106b21';
                ctx.fillRect(platform.x, platform.y, platform.w, platform.h);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);

                ctx.beginPath();
                ctx.moveTo(platform.x + platform.w / 2, platform.y);
                ctx.lineTo(platform.x + platform.w / 2, platform.y + platform.h);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(platform.x + platform.w / 2, platform.y + platform.h / 2, platform.h * 0.18, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeRect(platform.x, platform.y + platform.h * 0.25, platform.w * 0.18, platform.h * 0.5);
                ctx.strokeRect(platform.x, platform.y + platform.h * 0.38, platform.w * 0.07, platform.h * 0.24);

                ctx.strokeRect(platform.x + platform.w - platform.w * 0.18, platform.y + platform.h * 0.25, platform.w * 0.18, platform.h * 0.5);
                ctx.strokeRect(platform.x + platform.w - platform.w * 0.07, platform.y + platform.h * 0.38, platform.w * 0.07, platform.h * 0.24);

                ctx.fillStyle = '#9ca3af';
                ctx.fillRect(platform.x - 12, platform.y + platform.h * 0.38, 12, platform.h * 0.24);
                ctx.fillRect(platform.x + platform.w, platform.y + platform.h * 0.38, 12, platform.h * 0.24);
            } else if (currentMode === 'deatharrows') {
                ctx.fillStyle = '#22344c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(30, 48, 70, 0.7)';
                ctx.beginPath();
                ctx.ellipse(canvas.width * 0.15, canvas.height * 0.2, 130, 85, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#8b95a5';
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                });
            } else {
                ctx.fillStyle = '#2d2e3d';
                ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
                ctx.strokeStyle = '#4e5068';
                ctx.lineWidth = 3;
                ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
            }

            if (ball) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';
                ctx.stroke();
                ctx.closePath();
            }

            if (currentMode === 'deatharrows' && arrows) {
                arrows.forEach(arrow => {
                    ctx.beginPath();
                    ctx.arc(arrow.x, arrow.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#d93838';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.closePath();
                });
            }

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x, player.y - player.radius - 8);

            remotePlayers.forEach(rp => {
                ctx.beginPath();
                ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
                ctx.fillStyle = rp.color;
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
                ctx.fillText(rp.name, rp.x, rp.y - rp.radius - 8);
            });

            if (matchPaused && pauseMessage) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, canvas.height / 2 - 50, canvas.width, 100);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(pauseMessage, canvas.width / 2, canvas.height / 2 + 10);
            }
        }

        function loop() {
            if (!gameRunning) return;
            handleControls();
            updatePhysics();
            draw();
            animationFrameId = requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
